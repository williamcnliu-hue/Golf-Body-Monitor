<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>身体监控 · 高尔夫肌肉图谱</title>
<style>
  :root{
    --bg:#0a0e14; --bg2:#0f1620; --panel:#141d2a; --panel2:#1a2535; --line:#26333f;
    --text:#f0f5fb; --muted:#8294a8; --faint:#4a5a6e;
    --green:#3ddc84; --green2:#2fb86d; --yellow:#f0c14b; --red:#ff5d52; --accent:#5aa9ff; --accent2:#3d7fd6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:radial-gradient(1400px 700px at 50% -12%, #15212f 0%, var(--bg) 62%);
    color:var(--text); font-family:"Georgia","Songti SC",serif; min-height:100vh; padding:26px 14px 80px;
  }
  .wrap{max-width:560px;margin:0 auto;}
  header{text-align:center;margin-bottom:6px;}
  header .badge{font-size:10px;letter-spacing:4px;color:var(--accent);border:1px solid var(--accent2);padding:3px 12px;border-radius:20px;display:inline-block;margin-bottom:12px;opacity:.85;}
  header h1{font-size:26px;letter-spacing:8px;font-weight:600;background:linear-gradient(180deg,#fff,#aebece);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  header .date{color:var(--muted);font-size:12px;margin-top:7px;letter-spacing:3px;}

  .overall{margin:20px auto 10px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 40px rgba(0,0,0,.4);}
  .overall .lbl{font-size:13px;color:var(--muted);letter-spacing:3px;}
  .overall .lbl small{display:block;margin-top:6px;font-size:11px;letter-spacing:.5px;opacity:.85;line-height:1.5;max-width:200px;}
  .overall .ring{position:relative;width:74px;height:74px;flex-shrink:0;}
  .overall .ring svg{width:74px;height:74px;transform:rotate(-90deg);}
  .overall .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;}

  .legend{display:flex;justify-content:center;gap:14px;margin:8px 0;font-size:11px;color:var(--muted);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.g{background:var(--green)}.dot.y{background:var(--yellow)}.dot.r{background:var(--red)}.dot.n{background:#2b3a4d;border:1px solid var(--line)}

  /* 图 + 热区容器 */
  .figure{position:relative;width:100%;max-width:540px;margin:6px auto 0;}
  .figure img{width:100%;display:block;border-radius:14px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.4));}
  .hot{position:absolute;border-radius:50%;cursor:pointer;border:2px solid transparent;background:rgba(90,169,255,0);transition:background .25s,border-color .2s,transform .15s;}
  .hot:hover{border-color:var(--accent);background:rgba(90,169,255,.18);}
  .hot .tag{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);background:var(--panel2);color:var(--text);font-size:10px;padding:3px 7px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;border:1px solid var(--line);}
  .hot:hover .tag{opacity:1;}

  .tools{display:flex;justify-content:center;gap:12px;margin:18px auto 0;}
  .tools button{flex:1;max-width:220px;padding:13px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));color:var(--text);border-radius:12px;font-family:inherit;font-size:14px;cursor:pointer;letter-spacing:1px;}
  .tools button:active{transform:scale(.97);}

  .overlay{position:fixed;inset:0;background:rgba(4,8,14,.7);display:none;align-items:flex-end;justify-content:center;z-index:30;backdrop-filter:blur(4px);}
  .overlay.show{display:flex;}
  .panel{background:linear-gradient(180deg,var(--panel2),var(--bg2));border-top:2px solid var(--accent);border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:24px 24px 34px;animation:rise .3s cubic-bezier(.2,.85,.25,1);}
  @keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .panel h2{font-size:20px;margin-bottom:5px;}
  .panel .sub{color:var(--muted);font-size:12px;margin-bottom:14px;}
  .panel .hist{font-size:12.5px;margin-bottom:16px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .trend{font-weight:700;padding:2px 9px;border-radius:7px;font-size:12px;}
  .trend.up{color:var(--green);background:rgba(61,220,132,.13)}.trend.down{color:var(--red);background:rgba(255,93,82,.13)}.trend.flat{color:var(--muted);background:rgba(126,145,166,.13)}
  .score-row{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
  .score-row input[type=range]{flex:1;accent-color:var(--accent);height:6px;}
  .score-val{font-size:34px;font-weight:800;min-width:70px;text-align:center;padding:6px 0;border-radius:10px;}
  label.fld{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;}
  textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font-family:inherit;font-size:14px;resize:vertical;min-height:64px;margin-bottom:22px;}
  textarea:focus{outline:none;border-color:var(--accent);}
  .btns{display:flex;gap:12px;}
  button.act{flex:1;padding:15px;border:none;border-radius:12px;font-size:15px;font-family:inherit;cursor:pointer;letter-spacing:1px;}
  .save{background:linear-gradient(160deg,var(--accent),var(--accent2));color:#04101f;font-weight:800;}
  .clear{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .save:active,.clear:active{transform:scale(.97);}

  .toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(160deg,var(--green),var(--green2));color:#03140a;padding:14px 32px;border-radius:30px;font-size:14px;font-weight:800;opacity:0;pointer-events:none;transition:all .3s;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.45);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer{text-align:center;color:var(--faint);font-size:11px;margin-top:22px;line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">GOLF BODY MONITOR</div>
    <h1>身 体 监 控</h1>
    <div class="date" id="today"></div>
  </header>

  <div class="overall">
    <div class="lbl">今 日 整 体<small id="overallNote">点肌肉打分，自动算平均</small></div>
    <div class="ring">
      <svg viewBox="0 0 74 74">
        <circle cx="37" cy="37" r="31" fill="none" stroke="var(--line)" stroke-width="6"/>
        <circle id="ringFg" cx="37" cy="37" r="31" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="194.8" stroke-dashoffset="194.8"/>
      </svg>
      <div class="num" id="overallScore">—</div>
    </div>
  </div>

  <div class="legend">
    <span><i class="dot g"></i>绿 75+</span>
    <span><i class="dot y"></i>黄 50-74</span>
    <span><i class="dot r"></i>红 &lt;50</span>
    <span><i class="dot n"></i>未评估</span>
  </div>

  <!-- 解剖图 + 透明热区。热区用百分比定位，图缩放时跟着缩放 -->
  <div class="figure" id="figure">
    <img src="body.jpeg" alt="人体肌肉图" id="bodyImg">
    <!-- 热区由 JS 按 SPOTS 数组生成 -->
  </div>

  <div class="tools">
    <button id="exportBtn">📊 导出过往数据</button>
  </div>

  <footer>
    点肌肉圆点 → 打分 / 记录 · 每天按日期归档 · 圆点颜色 = 历史平均<br>
    “今天整体几分，重要肌肉就别发超过几分的力”
  </footer>
</div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <h2 id="pTitle">肌肉</h2>
      <div class="sub">拖动打分，写下今天的感觉</div>
      <div class="hist" id="hist"></div>
      <div class="score-row">
        <input type="range" min="0" max="100" value="75" id="score">
        <div class="score-val" id="scoreVal">75</div>
      </div>
      <label class="fld">备注（病症 / 感觉 / 代偿情况）</label>
      <textarea id="comment" placeholder="例：右肩外侧拉伸时发紧，击球瞬间靠核心代偿……"></textarea>
      <div class="btns">
        <button class="act clear" id="clearBtn">清除今天</button>
        <button class="act save" id="saveBtn">保存今天</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">✅ 已保存</div>

<script>
  // ====== 热区坐标表（百分比，相对整张图）======
  // x,y = 圆心位置%，r = 半径%。第一版按图估算，点不准我们再调。
  const SPOTS = [
    // —— 正面（图左半边）——
    {name:"颈部 (胸锁乳突肌)", x:35.5, y:15, r:2.0},
    {name:"左三角肌·正面", x:25.5, y:17.5, r:2.6},
    {name:"右三角肌·正面", x:43.5, y:17.5, r:2.6},
    {name:"左胸大肌", x:30.5, y:20.5, r:2.8},
    {name:"右胸大肌", x:39, y:20.5, r:2.8},
    {name:"左肱二头肌", x:23, y:24, r:2.4},
    {name:"右肱二头肌", x:46.5, y:24, r:2.4},
    {name:"左前臂屈肌 (握力)", x:21.5, y:30, r:2.4},
    {name:"右前臂屈肌 (握力)", x:48, y:30, r:2.4},
    {name:"上腹直肌", x:34.5, y:25, r:2.4},
    {name:"下腹直肌", x:34.5, y:30, r:2.4},
    {name:"左腹外斜肌 (转体)", x:30, y:29, r:2.2},
    {name:"右腹外斜肌 (转体)", x:39.5, y:29, r:2.2},
    {name:"左股四头肌", x:31, y:42, r:3},
    {name:"右股四头肌", x:39, y:42, r:3},
    {name:"左大腿内收肌", x:35, y:40, r:2},
    {name:"左胫前肌·小腿前", x:31.5, y:58, r:2.6},
    {name:"右胫前肌·小腿前", x:38.5, y:58, r:2.6},

    // —— 背面（图右半边）——
    {name:"斜方肌 (上/中)", x:67.5, y:16, r:2.8},
    {name:"左后三角肌", x:60.5, y:17.5, r:2.6},
    {name:"右后三角肌", x:74.5, y:17.5, r:2.6},
    {name:"左大圆肌·小圆肌 (肩袖)", x:62, y:20.5, r:2.2},
    {name:"右大圆肌·小圆肌 (肩袖)", x:73, y:20.5, r:2.2},
    {name:"左背阔肌 (挥杆主力)", x:62.5, y:25, r:2.8},
    {name:"右背阔肌 (挥杆主力)", x:72.5, y:25, r:2.8},
    {name:"竖脊肌 (下背·腰)", x:67.5, y:30, r:2.2},
    {name:"左肱三头肌", x:57.5, y:24, r:2.4},
    {name:"右肱三头肌", x:77.5, y:24, r:2.4},
    {name:"左臀大肌 (发力源)", x:63.5, y:34, r:2.8},
    {name:"右臀大肌 (发力源)", x:71.5, y:34, r:2.8},
    {name:"左腘绳肌", x:63, y:44, r:3},
    {name:"右腘绳肌", x:72, y:44, r:3},
    {name:"左腓肠肌·小腿后", x:63.5, y:58, r:2.6},
    {name:"右腓肠肌·小腿后", x:71.5, y:58, r:2.6},
  ];

  const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
  const dd=new Date();
  document.getElementById('today').textContent=dd.getFullYear()+' 年 '+(dd.getMonth()+1)+' 月 '+dd.getDate()+' 日';

  const KEY='golf_body_monitor_v3';
  let data={}; try{const raw=localStorage.getItem(KEY); if(raw)data=JSON.parse(raw);}catch(e){}

  const getCSS=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const colorFor=s=>{if(s===null||s===undefined)return null;if(s>=75)return getCSS('--green');if(s>=50)return getCSS('--yellow');return getCSS('--red');};
  const avgFor=n=>{const r=data[n];if(!r)return null;const a=Object.values(r).map(x=>x.score).filter(s=>typeof s==='number');return a.length?Math.round(a.reduce((p,c)=>p+c,0)/a.length):null;};
  const daysFor=n=>{const r=data[n];return r?Object.keys(r).length:0;};
  const todayScoreOf=n=>{const r=data[n];if(!r)return null;const t=r[todayStr()];return t&&typeof t.score==='number'?t.score:null;};
  const prevScoreOf=n=>{const r=data[n];if(!r)return null;const ds=Object.keys(r).filter(d=>d<todayStr()).sort();if(!ds.length)return null;const l=r[ds[ds.length-1]];return l&&typeof l.score==='number'?l.score:null;};

  // 生成热区
  const figure=document.getElementById('figure');
  SPOTS.forEach(s=>{
    const el=document.createElement('div');
    el.className='hot';
    el.style.left=(s.x-s.r)+'%';
    el.style.top=(s.y-s.r)+'%';
    el.style.width=(s.r*2)+'%';
    el.style.height=(s.r*2)+'%';
    el.dataset.name=s.name;
    const tag=document.createElement('span'); tag.className='tag'; tag.textContent=s.name; el.appendChild(tag);
    el.addEventListener('click',()=>openPanel(s.name));
    figure.appendChild(el);
  });

  function paintHots(){
    document.querySelectorAll('.hot').forEach(el=>{
      const a=avgFor(el.dataset.name);
      if(a!==null){ el.style.background=hexA(colorFor(a),.45); el.style.borderColor=colorFor(a); }
      else { el.style.background='rgba(90,169,255,0)'; el.style.borderColor='transparent'; }
    });
  }
  function hexA(hex,a){ // #rrggbb -> rgba
    const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function renderOverall(){
    const todays=SPOTS.map(s=>todayScoreOf(s.name)).filter(x=>x!==null);
    const numEl=document.getElementById('overallScore'),note=document.getElementById('overallNote'),ring=document.getElementById('ringFg');
    const C=2*Math.PI*31;
    if(!todays.length){numEl.textContent='—';numEl.style.color='var(--muted)';note.textContent='点肌肉打分，自动算平均';ring.style.strokeDashoffset=C;return;}
    const avg=Math.round(todays.reduce((p,c)=>p+c,0)/todays.length);
    numEl.textContent=avg;numEl.style.color=colorFor(avg);
    ring.style.stroke=colorFor(avg);ring.style.strokeDashoffset=C*(1-avg/100);
    note.textContent='今天已记录 '+todays.length+' 块 · 别发超过 '+avg+' 分的力';
  }

  let current=null;
  const overlay=document.getElementById('overlay'),pTitle=document.getElementById('pTitle');
  const score=document.getElementById('score'),scoreVal=document.getElementById('scoreVal');
  const comment=document.getElementById('comment'),hist=document.getElementById('hist');

  function openPanel(name){
    current=name; pTitle.textContent=name;
    const rec=(data[name]||{})[todayStr()]||{};
    score.value=(typeof rec.score==='number')?rec.score:75; scoreVal.textContent=score.value; tint(score.value);
    comment.value=rec.comment||'';
    const a=avgFor(name),n=daysFor(name),prev=prevScoreOf(name),tdy=(typeof rec.score==='number')?rec.score:null;
    hist.innerHTML='';
    const span=document.createElement('span'); span.textContent=(a!==null)?`历史平均 ${a} 分 · 已记录 ${n} 天`:'还没有历史记录'; hist.appendChild(span);
    if(prev!==null&&tdy!==null){const diff=tdy-prev;const t=document.createElement('span');
      if(diff>2){t.className='trend up';t.textContent='↑ 比上次 +'+diff;}
      else if(diff<-2){t.className='trend down';t.textContent='↓ 比上次 '+diff;}
      else{t.className='trend flat';t.textContent='→ 持平';} hist.appendChild(t);}
    overlay.classList.add('show');
  }
  score.oninput=()=>{scoreVal.textContent=score.value;tint(score.value);};
  function tint(s){s=+s;scoreVal.style.color='#04101f';scoreVal.style.background=colorFor(s);}

  document.getElementById('saveBtn').onclick=()=>{
    if(!current)return; if(!data[current])data[current]={};
    data[current][todayStr()]={score:+score.value,comment:comment.value.trim()};
    persist();paintHots();renderOverall();close();toast('✅ 已保存：'+current+' '+score.value+' 分');
  };
  document.getElementById('clearBtn').onclick=()=>{
    if(!current)return; if(data[current])delete data[current][todayStr()];
    if(data[current]&&Object.keys(data[current]).length===0)delete data[current];
    persist();paintHots();renderOverall();close();toast('已清除今天');
  };
  overlay.onclick=e=>{if(e.target===overlay)close();};
  function close(){overlay.classList.remove('show');current=null;}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}

  document.getElementById('exportBtn').onclick=()=>{
    let txt='身体监控 · 过往数据导出\n生成时间：'+todayStr()+'\n\n';
    SPOTS.forEach(s=>{const a=avgFor(s.name); txt+= a!==null?`  ${s.name}：平均 ${a} 分（${daysFor(s.name)} 天）\n`:`  ${s.name}：—\n`;});
    const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='身体监控_'+todayStr()+'.txt';a.click();URL.revokeObjectURL(url);
    toast('✅ 已导出');
  };

  const toastEl=document.getElementById('toast');let tt=null;
  function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2000);}

  paintHots(); renderOverall();
</script>
</body>
</html>
